services:
  - type: web
    name: latecuts-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STAFF_PIN
        sync: false
      - key: STAFF_SESSION_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
